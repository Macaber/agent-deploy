# API-Server 网关（ACK 版）：与 deploy/api-server-deploy.yaml 的差异仅两处——
#   1. image 改为 ACR 地址（同 Region 走 VPC 内网拉取）
#   2. WORKSPACE_DOMAIN / WORKSPACE_BASE_URL 按 ACK 环境的 SLB IP / 域名修改
# 对外暴露：保留 NodePort 30000（需在 ACK 控制台为节点安全组放通 30000）；
#          生产推荐将下方 Service 改为 LoadBalancer 类型（自动关联 SLB）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-server-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-server-clusterrole
rules:
- apiGroups: ["ai.example.com"]
  resources: ["workspaces", "workspaces/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-server-clusterrolebinding
subjects:
- kind: ServiceAccount
  name: api-server-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: api-server-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: default
  labels:
    app: api-server
spec:
  # 双副本：api-server 是创建/唤醒 workspace 的唯一入口，单副本重启期间所有请求
  # 都会变成 502。需要 HA 的场景可继续上调，并配合下方 PDB。
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      serviceAccountName: api-server-sa
      # 尽量把两副本分散到不同节点；单节点场景下退化为同节点部署（不阻塞调度）。
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: api-server
      containers:
      - name: api-server
        image: registry.cn-hangzhou.aliyuncs.com/<your-namespace>/api-server:v1.0.0 # 替换为实际 ACR 地址
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: WORKSPACE_DOMAIN
          value: "yourdomain.com" # Workspace 泛域名后缀，与 DNS 泛域名解析保持一致
        - name: WORKSPACE_BASE_URL
          value: "http://<SLB-IP or 域名>/bocomwork/ws" # API-Server 拼接 Workspace 访问入口与探活地址的基址
        # 金丝雀/灰度发布集群配置（若当前 api-server 部署在灰度集群，开启后探活 Cookie 将附带 X-Canary 灰度标识）：
        # - name: CANARY
        #   value: "new"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-server-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-server
---
apiVersion: v1
kind: Service
metadata:
  name: api-server-svc
  namespace: default
spec:
  type: NodePort # 生产推荐改为 LoadBalancer（自动关联 SLB）
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000 # 方式一：http://<节点IP>:30000（需放通安全组）
  selector:
    app: api-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-server-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # 创建/唤醒是同步长轮询（WORKSPACE_POLL_TIMEOUT 默认 30s），nginx 默认 60s
    # 读超时余量太小，这里显式放宽到 90s。
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
    # 单 IP 并发连接上限：压测机通常只有一两个出口 IP，200 会被误伤成 503。
    nginx.ingress.kubernetes.io/limit-connections: "1000"
    # 只在连接级错误上重试一次：POST 创建请求被多次重试会在故障时放大流量。
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "5"
spec:
  ingressClassName: nginx # ACK Nginx Ingress 组件的 IngressClass 名称（Operator 创建的 Workspace Ingress 同样硬编码 nginx）
  rules:
  - host: launcher.workspace.yourdomain.com # 方式二：通过域名访问（泛域名解析到 SLB IP 后自动生效）
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-server-svc
            port:
              number: 3000
