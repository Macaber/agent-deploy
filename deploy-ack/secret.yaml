# OSS 访问凭证（必须在 default 命名空间）
# 说明：即使 ACK 托管 csi-plugin 支持节点 RAM 角色免 AK 挂载，本平台也必须保留本 Secret——
#       Operator 删除 Workspace 时直接读取 akId/akSecret 调用 OSS SDK 清空 workspaces/<name> 前缀数据。
apiVersion: v1
kind: Secret
metadata:
  name: oss-secret
  namespace: default
type: Opaque
stringData:
  akId: "YOUR_ACCESS_KEY_ID"           # 替换为 RAM 用户的 AccessKey ID
  akSecret: "YOUR_ACCESS_KEY_SECRET"   # 替换为 RAM 用户的 AccessKey Secret
