                        args:
                          description: Args specifies startup arguments for init container
                          items:
                            type: string
                          type: array
                        command:
                          description: Command specifies startup command (entrypoint)
                            for init container
                          items:
                            type: string
                          type: array
                        configMapVolumeMounts:
                          description: ConfigMapVolumeMounts specifies ConfigMaps
                            to mount as volumes inside the init container
                          items:
                            description: ConfigMapVolumeMount defines a volume mount
