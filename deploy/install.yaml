              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceSpec defines the desired state of Workspace
            properties:
              configMapVolumeMounts:
                description: ConfigMapVolumeMounts specifies ConfigMaps to mount as
                  volumes inside the workspace container
                items:
                  description: ConfigMapVolumeMount defines a volume mount from a
                    Kubernetes ConfigMap.
                  properties:
                    configMapName:
                      description: ConfigMapName is the name of the ConfigMap to mount
                      type: string
                    mountPath:
                      description: MountPath is the path inside the container where
                        the volume should be mounted
                      type: string
