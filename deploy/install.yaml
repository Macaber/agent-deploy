                    type: string
                  image:
                    description: Image is the container image to run for the workspace
                    type: string
                  initContainers:
                    description: InitContainers specifies custom init containers executed
                      before the main container starts
                    items:
                      description: InitContainerSpec defines configuration for an
                        init container executed before main container start.
