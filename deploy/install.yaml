              endpoint:
                description: Endpoint is the external URL or access path for the workspace
                type: string
              lastActiveTime:
                description: |-
                  LastActiveTime is the timestamp used as the start of the IdleTimeout run window.
                  Updated on first status init, on wake/start via API-Server, and when phase transitions
                  into Running from Sleeping/Stopped/Pending/Failed. Not updated by Ingress HTTP traffic.
                format: date-time
                type: string
              phase:
                description: Phase is the current high-level state of the workspace
                enum:
                - Pending
                - Starting
                - Running
                - Sleeping
                - Stopped
                - Failed
                type: string
              podName:
                description: PodName is the name of the active Pod running the workspace
                  runtime
                type: string
              pvcName:
                description: PVCName is the name of the persistent volume claim allocated
                  for the workspace
                type: string
            type: object
