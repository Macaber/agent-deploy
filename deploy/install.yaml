                      type: string
                  required:
                  - mountPath
                  - pvcName
                  type: object
                type: array
              stopped:
                description: Stopped indicates whether the workspace is manually stopped
                  (scaled to 0 replicas)
                type: boolean
              storage:
                description: Storage defines the PVC size and storage class for user
                  files
                properties:
                  size:
                    description: Size specifies PVC size, e.g., "10Gi"
                    type: string
                  storageClass:
                    description: StorageClass specifies the K8s StorageClass to request
