apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-egress-mode-observer
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-egress-mode-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-egress-mode-observer
subjects:
- kind: ServiceAccount
  name: api-server-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-egress-history-reader
  namespace: agent-deploy-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["workspace-egress-history"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-egress-history-reader
  namespace: agent-deploy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-egress-history-reader
subjects:
- kind: ServiceAccount
  name: api-server-sa
  namespace: default
- kind: ServiceAccount
  name: workspace-egress
  namespace: agent-deploy-system
