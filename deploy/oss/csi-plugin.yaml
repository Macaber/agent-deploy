# 阿里云 OSS CSI 节点插件（自建集群 / containerd / k8s 1.25）
#
# 架构说明（csi-plugin v1.30.4+）：
# ossfs 不再通过 systemd-run 直接在宿主机上执行（旧架构依赖宿主机的 libssl.so.10 等库），
# 而是由 csi-controller 在 ControllerPublishVolume 阶段于 ack-csi-fuse 命名空间创建
# FUSE Pod（镜像 csi-ossfs），由该 Pod 完成挂载。宿主机只需有 systemd。
#
# 配套部署：csi-controller.yaml（必须，提供 controller 服务 + external-attacher）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-oss-admin
  namespace: default
---
# FUSE Pod 运行命名空间（v1.30.4+ 起固定）
apiVersion: v1
kind: Namespace
metadata:
  name: ack-csi-fuse
---
# FUSE Pod 使用的 ServiceAccount（RRSA 鉴权时被引用；与官方 chart 保持一致，提前创建）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-fuse-ossfs
  namespace: ack-csi-fuse
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-oss-admin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # controller 在 ack-csi-fuse 中创建/管理 FUSE Pod
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # external-attacher
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  # external-attacher 选主
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-oss-admin
subjects:
  - kind: ServiceAccount
    name: csi-oss-admin
    namespace: default
roleRef:
  kind: ClusterRole
  name: csi-oss-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: ossplugin.csi.alibabacloud.com
spec:
  # v1.30.4+ 新架构：FUSE Pod 在 ControllerPublishVolume 阶段创建，必须为 true
  attachRequired: true
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-plugin-oss
  namespace: default
spec:
  selector:
    matchLabels:
      app: csi-plugin-oss
  template:
    metadata:
      labels:
        app: csi-plugin-oss
    spec:
      serviceAccountName: csi-oss-admin
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.8.0
          imagePullPolicy: IfNotPresent
          args:
            - "--v=2"
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/csi-plugins/ossplugin.csi.alibabacloud.com/csi.sock"
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: csi-plugin
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          image: registry.cn-hangzhou.aliyuncs.com/acs/csi-plugin:v1.36.2
          imagePullPolicy: IfNotPresent
          args:
            - "--driver=oss"
            - "--nodeid=$(KUBE_NODE_NAME)"
            - "--endpoint=$(CSI_ENDPOINT)"
            # 节点插件只跑 node service；controller service 由 csi-controller 提供
            - "--run-controller-service=false"
            - "--run-node-service=true"
          env:
            # 专有云/内网 OSS 开关：禁止 driver 改写 URL、不强制 https://，
            # 让 ossfs 使用默认的 http 协议（内网环境必须为 true，与 controller 保持一致）
            - name: PRIVATE_CLOUD_TAG
              value: "true"
            # 自建集群无 ECS metadata，显式提供 CLUSTER_ID 避免 metadata 探测
            - name: CLUSTER_ID
              value: "self-managed-cluster"
            - name: KUBELET_ROOT_DIR
              value: "/var/lib/kubelet"
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSI_ENDPOINT
              value: unix://var/lib/kubelet/csi-plugins/ossplugin.csi.alibabacloud.com/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /var/lib/kubelet/csi-plugins/ossplugin.csi.alibabacloud.com
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            # FUSE Pod 的 globalmount/socket 目录（v1.30.4+ 挂载架构）
            - name: fuse-dir
              mountPath: /run/fuse.ossfs
              mountPropagation: Bidirectional
            - name: host-dev
              mountPath: /dev
              mountPropagation: HostToContainer
            - name: host-sys
              mountPath: /sys
            - name: host-log
              mountPath: /var/log
            # 供 /host/etc（mime.types 检查）与 /host/var/run/ossfs（metrics）使用
            - name: host-root
              mountPath: /host
              mountPropagation: Bidirectional
      volumes:
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/csi-plugins/ossplugin.csi.alibabacloud.com
            type: DirectoryOrCreate
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: fuse-dir
          hostPath:
            path: /run/fuse.ossfs
            type: DirectoryOrCreate
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-log
          hostPath:
            path: /var/log
        - name: host-root
          hostPath:
            path: /
            type: Directory
