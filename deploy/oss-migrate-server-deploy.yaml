# oss-migrate-server: Deployment for OSS to OSS data migration
#
# Unlike local-path migrate-server (which runs as a DaemonSet to access node disks),
# oss-migrate-server migrates object data directly across OSS paths over the network.
# A single-replica Deployment is sufficient.
#
# Credentials:
#   Reuses the cluster's existing oss-secret (in default namespace),
#   providing akId and akSecret.
#
# Access:
#   Exposed via Service (NodePort 30081 or ClusterIP).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oss-migrate-server
  namespace: default
  labels:
    app: oss-migrate-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oss-migrate-server
  template:
    metadata:
      labels:
        app: oss-migrate-server
    spec:
      containers:
        - name: oss-migrate-server
          image: oss-migrate-server:v1.0.0 # 替换为你的私有镜像仓库地址
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # 1. 阿里云 OSS 凭证（从 oss-secret 读取）
            - name: akId
              valueFrom:
                secretKeyRef:
                  name: oss-secret
                  key: akId
                  optional: true
            - name: akSecret
              valueFrom:
                secretKeyRef:
                  name: oss-secret
                  key: akSecret
                  optional: true

            # 2. OSS Endpoint（请根据实际环境填写内网 Endpoint，例如 oss-cn-hangzhou-internal.aliyuncs.com）
            - name: OSS_ENDPOINT
              value: "oss-cn-hangzhou-internal.aliyuncs.com"

            # 3. 默认源与目标 Bucket / 前缀
            - name: OSS_SOURCE_BUCKET
              value: "oss://euvduatc-oss"
            - name: OSS_SOURCE_PREFIX
              value: "workspaces"
            - name: OSS_TARGET_BUCKET
              value: "oss://euvduatc-oss"
            - name: OSS_TARGET_PREFIX
              value: "workspaces"

            # 4. 默认迁移子目录与排除规则（默认不排除任何内容，完整保留 skills 等数据）
            - name: OSS_MIGRATE_DIRS
              value: "workspace,bocomwork,bocomcode"
            - name: OSS_MIGRATE_EXCLUDES
              value: ""

            # 5. 迁移审计日志路径
            - name: OSS_MIGRATE_LOG
              value: "/var/log/oss-migrate-server/oss2oss-migrate.log"

            # 6. 控制台登录认证（默认用户 admin / 密码 admin，生产环境可修改或从 Secret 读取）
            - name: OSS_MIGRATE_AUTH_USER
              value: "admin"
            - name: OSS_MIGRATE_AUTH_PASSWORD
              value: "admin"

            # 7. 反向代理前缀（如通过 Nginx /bocomwork/oss-migrate/ 代理，配合 X-Forwarded-Prefix 双重兜底）
            - name: OSS_MIGRATE_URL_PREFIX
              value: "/bocomwork/oss-migrate"

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: log-dir
              mountPath: /var/log/oss-migrate-server
      volumes:
        - name: log-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oss-migrate-server-svc
  namespace: default
  labels:
    app: oss-migrate-server
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30081
  selector:
    app: oss-migrate-server
