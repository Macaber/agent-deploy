apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-deploy-controller-manager
  namespace: agent-deploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-deploy-manager-role
rules:
- apiGroups: ["ai.example.com"]
  resources: ["workspaces", "workspaces/status", "workspaces/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-deploy-manager-rolebinding
subjects:
- kind: ServiceAccount
  name: agent-deploy-controller-manager
  namespace: agent-deploy-system
roleRef:
  kind: ClusterRole
  name: agent-deploy-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-deploy-operator-java
  namespace: agent-deploy-system
  labels:
    app.kubernetes.io/name: agent-deploy-java
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-deploy-java
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-deploy-java
        control-plane: controller-manager
    spec:
      serviceAccountName: agent-deploy-controller-manager
      containers:
      - name: manager
        image: agent-deploy-operator-java:v1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: OPERATOR_ENABLED
          value: "true"
        - name: APISERVER_ENABLED
          value: "false"
        - name: LEADER_ELECTION_ENABLED
          value: "true"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
