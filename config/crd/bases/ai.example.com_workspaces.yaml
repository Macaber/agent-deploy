---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workspaces.ai.example.com
spec:
  group: ai.example.com
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace is the Schema for the workspaces API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceSpec defines the desired state of Workspace
            properties:
              exposeSSH:
                description: ExposeSSH enables SSH access to the workspace container
                type: boolean
              idleTimeout:
                description: |-
                  IdleTimeout specifies the duration of inactivity after which the workspace scales to 0
                  e.g. "30m", "1h"
                type: string
              owner:
                description: Owner indicates the user ID owning this workspace
                type: string
              repository:
                description: Repository is the Git repo to clone upon initial startup
                properties:
                  branch:
                    description: Branch is the target Git branch to check out
                    type: string
                  commit:
                    description: Commit is the target Git commit hash to check out
                    type: string
                  secretRef:
                    description: SecretRef references a Secret containing Git auth
                      credentials (SSH key or token)
                    type: string
                  url:
                    description: URL is the Git repository URL (HTTPS or SSH)
                    type: string
                required:
                - url
                type: object
              runtime:
                description: Runtime specifies the container image and resource requirements
                properties:
                  args:
                    description: Args specifies custom container startup arguments
                    items:
                      type: string
                    type: array
                  command:
                    description: Command specifies custom container startup command
                      (entrypoint)
                    items:
                      type: string
                    type: array
                  cpu:
                    description: CPU specifies CPU resource limits/requests, e.g.
                      "500m", "2"
                    type: string
                  env:
                    description: Env is a list of environment variables to inject
                      into the container
                    items:
                      description: EnvVar represents a simple environment variable
                        key-value pair.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  healthPath:
                    description: HealthPath is the HTTP path for readiness probe check
                      (e.g. "/health"). If empty, defaults to TCP socket check.
                    type: string
                  image:
                    description: Image is the container image to run for the workspace
                    type: string
                  memory:
                    description: Memory specifies Memory resource limits/requests,
                      e.g. "512Mi", "2Gi"
                    type: string
                  port:
                    description: Port specifies a custom container port. If not specified,
                      defaults based on image (e.g. 80 for nginx, 8080 otherwise).
                    format: int32
                    type: integer
                  postStartScript:
                    description: PostStartScript is a multiline shell script executed
                      as a postStart lifecycle hook immediately after container start
                    type: string
                  volumeMounts:
                    description: VolumeMounts specifies custom directory mounts inside
                      the container mapping to the workspace storage
                    items:
                      description: VolumeMount defines a directory mount point inside
                        the container mapping to the workspace storage.
                      properties:
                        mountPath:
                          description: MountPath is the path inside the container
                            where the volume should be mounted
                          type: string
                        subPath:
                          description: SubPath is the subdirectory within the workspace
                            volume to mount
                          type: string
                      required:
                      - mountPath
                      type: object
                    type: array
                required:
                - image
                type: object
              sharedVolumeMounts:
                description: SharedVolumeMounts specifies pre-existing generic/shared
                  PVCs to mount
                items:
                  description: SharedVolumeMount defines a mount of a pre-existing
                    generic/shared PVC.
                  properties:
                    mountPath:
                      description: MountPath is the path inside the container where
                        the volume should be mounted
                      type: string
                    pvcName:
                      description: PVCName is the name of the pre-existing PersistentVolumeClaim
                        to mount
                      type: string
                    subPath:
                      description: SubPath is the subdirectory within the shared volume
                        to mount
                      type: string
                  required:
                  - mountPath
                  - pvcName
                  type: object
                type: array
              stopped:
                description: Stopped indicates whether the workspace is manually stopped
                  (scaled to 0 replicas)
                type: boolean
              storage:
                description: Storage defines the PVC size and storage class for user
                  files
                properties:
                  size:
                    description: Size specifies PVC size, e.g., "10Gi"
                    type: string
                  storageClass:
                    description: StorageClass specifies the K8s StorageClass to request
                    type: string
                required:
                - size
                type: object
            required:
            - owner
            - runtime
            - storage
            type: object
          status:
            description: WorkspaceStatus defines the observed state of Workspace.
            properties:
              conditions:
                description: Conditions represent the current state of the Workspace
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the external URL or access path for the workspace
                type: string
              expiryTime:
                description: ExpiryTime indicates the computed time when this workspace
                  will expire under the TTL policy
                format: date-time
                type: string
              lastActiveTime:
                description: LastActiveTime indicates the timestamp of the last detected
                  activity
                format: date-time
                type: string
              phase:
                description: Phase is the current high-level state of the workspace
                enum:
                - Pending
                - Starting
                - Running
                - Sleeping
                - Stopped
                - Failed
                type: string
              podName:
                description: PodName is the name of the active Pod running the workspace
                  runtime
                type: string
              pvcName:
                description: PVCName is the name of the persistent volume claim allocated
                  for the workspace
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
