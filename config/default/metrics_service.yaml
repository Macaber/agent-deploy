apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: agent-deploy
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-service
  namespace: system
spec:
  ports:
  # Plain HTTP: the manager runs with --metrics-secure=false (see
  # manager_metrics_patch.yaml), so the port is named "http" to make the
  # protocol obvious to anyone wiring up a scrape config.
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: agent-deploy
