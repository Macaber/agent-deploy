<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · local-path → OSS 迁移控制台</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#111827; --panel2:#161f30; --line:#233047; --line-strong:#2f3f5c;
    --fg:#e8edf6; --fg-dim:#c2cce0; --muted:#8494ad; --faint:#5d6b84;
    --accent:#5b93ff; --accent-strong:#3f7bf0; --err:#ff6169;
    --r:10px; --r-lg:16px; --ease:cubic-bezier(.22,.61,.36,1);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
    --ring:0 0 0 2px var(--bg), 0 0 0 4px rgba(91,147,255,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; display:grid; place-items:center; padding:24px; color:var(--fg);
    font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 560px at 100% -10%, rgba(91,147,255,.12), transparent 60%),
      radial-gradient(900px 520px at -10% 110%, rgba(61,220,132,.06), transparent 55%),
      var(--bg);
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(91,147,255,.32);}
  :focus-visible{outline:none; box-shadow:var(--ring); border-radius:var(--r);}
  .card{
    width:100%; max-width:380px; padding:30px 28px 26px;
    background:linear-gradient(180deg, rgba(22,31,48,.85), rgba(17,24,39,.85));
    border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-lg);
    backdrop-filter:saturate(140%) blur(8px);
    animation:rise .5s var(--ease) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ .card{animation:none;} }
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:22px;}
  .logo{
    width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
    color:#0a1424; font-weight:800; font-size:16px;
    background:linear-gradient(150deg,#7fb0ff,#4c8dff);
    box-shadow:0 6px 18px -8px rgba(91,147,255,.8), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .brand h1{font-size:15px; margin:0; font-weight:650; letter-spacing:.2px;}
  .brand .sub{display:block; color:var(--muted); font-weight:500; font-size:12px; margin-top:2px;}
  .lead{color:var(--fg-dim); font-size:12.5px; margin:0 0 18px;}
  .err{
    display:flex; gap:8px; align-items:flex-start;
    background:rgba(255,97,105,.12); color:#ffc2c5; border:1px solid rgba(255,97,105,.4);
    padding:10px 12px; border-radius:var(--r); font-size:12.5px; margin-bottom:16px;
  }
  .err::before{content:"⚠"; color:var(--err);}
  label{display:block; font-size:12px; color:var(--muted); margin:14px 0 7px; font-weight:600; letter-spacing:.02em;}
  input{
    width:100%; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--fg);
    background:var(--panel2); border:1px solid var(--line); border-radius:var(--r);
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  input:hover{border-color:var(--line-strong);}
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,147,255,.18);}
  button{
    width:100%; margin-top:22px; padding:11px; border-radius:var(--r); cursor:pointer;
    font-size:14px; font-weight:600; font-family:inherit; color:#fff;
    background:linear-gradient(180deg,#6aa0ff,var(--accent-strong)); border:1px solid var(--accent-strong);
    box-shadow:0 8px 22px -10px rgba(91,147,255,.9), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .08s var(--ease), background .16s var(--ease), box-shadow .16s var(--ease);
  }
  button:hover{background:linear-gradient(180deg,#7aabff,#4a86f2); transform:translateY(-1px);}
  button:active{transform:translateY(0) scale(.99);}
  .foot{margin-top:18px; text-align:center; color:var(--faint); font-size:11.5px;}
</style>
</head>
<body>
<form class="card" method="POST" action="login/submit">
  <div class="brand">
    <span class="logo" aria-hidden="true">O</span>
    <h1>迁移控制台<span class="sub">local-path → OSS</span></h1>
  </div>
  <p class="lead">请登录后继续。此控制台可删除 Workspace / PVC / PV，仅限授权人员使用。</p>
  <div class="err" id="err" style="display:none"></div>
  <input type="hidden" name="next" id="nextField" value="" />
  <label for="username">用户名</label>
  <input id="username" name="username" autocomplete="username" autofocus required />
  <label for="password">密码</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required />
  <button type="submit">登录</button>
  <div class="foot">未授权访问将被拒绝并记录</div>
</form>
<script>
  // Preserve the return path (?next=) when the server bounced us here.
  try {
    const n = new URLSearchParams(location.search).get('next');
    if (n) document.getElementById('nextField').value = n;
  } catch (e) {}
</script>
</body>
</html>
